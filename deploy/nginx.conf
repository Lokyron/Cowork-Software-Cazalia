# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ MODÈLE — NE PAS APPLIQUER TEL QUEL.                                      ║
# ║ Deux marqueurs doivent être remplacés avant toute utilisation :          ║
# ║   PROXY_IP_A_RENSEIGNER   IP du reverse proxy de confiance (NPM, CT 100) ║
# ║   DOMAINE_A_RENSEIGNER    domaine public (le vhost de prod porte le vrai)║
# ║ `set_real_ip_from PROXY_IP_A_RENSEIGNER` fait volontairement échouer     ║
# ║ `nginx -t` tant que le marqueur est là. Ne jamais copier ce fichier par- ║
# ║ dessus le vhost de prod : suivre deploy/correctifs-tls-seo.md.           ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Reverse proxy Nginx pour Cazalia — LXC Debian / Proxmox.
# - sert le build front statique (web/dist)
# - proxifie /api vers l'API Express (127.0.0.1:3001)
#
# Copier dans /etc/nginx/sites-available/ puis activer via un lien symbolique.
#
# ⚠️ L'API ne doit écouter QUE sur 127.0.0.1 (HOST=127.0.0.1 dans l'unité
# systemd). Si le port 3001 est joignable depuis le LAN, tout ce qui suit —
# en-têtes de sécurité, limitation de débit basée sur l'adresse IP réelle — est
# contournable en s'adressant directement à l'API.

# Zones de limitation de débit, partagées par l'ensemble des workers nginx.
# Deuxième rempart devant celui de l'application : nginx absorbe le volume avant
# que Node n'ait à traiter la requête.
limit_req_zone $binary_remote_addr zone=cazalia_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cazalia_auth:10m rate=1r/s;

# Protocole d'origine de la requête.
#
# Le service est joignable directement sur le LAN (http) ET via le reverse proxy
# HTTPS (le reverse proxy). Transmettre `$scheme` en dur ferait croire à l'API que tout
# arrive en clair : elle ne poserait jamais l'attribut `Secure` sur le cookie de
# session et n'émettrait pas HSTS, alors même que le visiteur est en HTTPS.
#
# On reprend donc l'en-tête reçu, mais UNIQUEMENT lorsqu'il vient du proxy de
# confiance. `$realip_remote_addr` est l'adresse réelle du pair TCP, avant la
# réécriture opérée par `set_real_ip_from` — un client du LAN ne peut pas se
# faire passer pour le proxy en envoyant lui-même l'en-tête.
map $realip_remote_addr $cazalia_proto {
    default       $scheme;                  # accès direct : le protocole observé fait foi
    "PROXY_IP_A_RENSEIGNER" $http_x_forwarded_proto;  # le reverse proxy — NPM (terminaison TLS)
}

# Faut-il renvoyer le visiteur vers HTTPS ?  (1 = oui, 0 = non)
#
# nginx écoute en clair sur :80 derrière le reverse proxy HTTPS : `$scheme`
# vaut TOUJOURS `http` ici, même pour un visiteur arrivé en https. On ne peut
# donc pas se fonder dessus.
#
# MESURE (sonde de la prod depuis l'extérieur) : NPM pose `X-Forwarded-Proto:
# https` sur le chemin 443 (et écrase la valeur du client), mais n'injecte RIEN
# sur le chemin port 80. Pour un visiteur réel en http, l'en-tête est donc
# ABSENT. La condition est par conséquent inversée :
#
#   rediriger  <=>  le pair TCP est le proxy de confiance
#                   ET  il ne déclare PAS `X-Forwarded-Proto: https`
#
#   - https relayé par NPM (XFP=https)       -> 0 : servi, pas de boucle ;
#   - http public relayé (XFP absent)        -> 1 : redirigé ;
#   - http relayé, XFP=http                  -> 1 : redirigé ;
#   - accès direct LAN (pair != proxy)       -> 0 : intact, quel que soit l'en-tête ;
#   - un client du LAN qui forge l'en-tête   -> 0 : ignoré (pair != proxy).
#
# ⚠️ MODE DE DÉFAILLANCE : cette condition échoue « fermé ». Si NPM cessait de
# poser `X-Forwarded-Proto: https` sur le chemin 443, TOUTE requête https
# serait redirigée vers https : BOUCLE, site inaccessible. (L'ancienne
# condition, « proxy ET XFP=http », échouait « ouvert » mais ne redirigeait
# jamais rien.) À surveiller après toute modification de NPM (CT 100) ; la
# redirection est en 302 pour que le retour arrière répare aussi les
# navigateurs déjà touchés. Voir le runbook, phase 1 (observer avant d'appliquer).

# Le proxy déclare-t-il autre chose que « https » ?  (absent, vide, http, autre -> 1)
map $http_x_forwarded_proto $cazalia_xfp_not_https {
    https   0;
    default 1;
}

# Le pair TCP est-il le proxy de confiance ?
# `$realip_remote_addr` = adresse réelle du pair, avant la réécriture de
# `set_real_ip_from` : un client du LAN ne peut pas se faire passer pour lui.
map $realip_remote_addr $cazalia_from_proxy {
    default                0;
    PROXY_IP_A_RENSEIGNER  1;   # MÊME adresse que `set_real_ip_from` plus bas
}

# Décision finale : proxy ("1") ET pas https ("1") -> "11".
map "$cazalia_from_proxy$cazalia_xfp_not_https" $cazalia_force_https {
    default 0;
    "11"    1;
}

# Hôte de destination de la redirection : liste blanche.
# `$host` suit l'en-tête `Host` du client ; s'en servir tel quel ferait de
# nous un redirecteur ouvert (`Host: evil.example.com` -> Location vers evil).
# Le site sert le domaine nu ET `www` ; tout autre nom retombe sur le domaine nu.
# (Une map plutôt qu'un simple `$server_name` : `$server_name` ne vaut que le
# PREMIER nom du `server_name` et renverrait donc `www` vers le domaine nu.)
map $host $cazalia_redirect_host {
    default                    DOMAINE_A_RENSEIGNER;
    DOMAINE_A_RENSEIGNER       DOMAINE_A_RENSEIGNER;
    www.DOMAINE_A_RENSEIGNER   www.DOMAINE_A_RENSEIGNER;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE_A_RENSEIGNER www.DOMAINE_A_RENSEIGNER;

    # N'annonce pas la version de nginx dans les réponses et les pages d'erreur.
    server_tokens off;

    # ── Redirections de répertoire en URL relative ───────────────────────────
    # `/tarifs` -> 301 vers `/tarifs/` (le build contient un répertoire par page
    # publique). Par défaut nginx fabrique une URL ABSOLUE avec SON schéma : ici
    # `http`, puisqu'il est derrière le proxy TLS. Un visiteur en https était
    # ainsi renvoyé en clair (`Location: http://cazalia.fr/tarifs/`). Avec
    # `off`, le `Location` devient `/tarifs/` : le navigateur garde le schéma
    # et l'hôte d'origine. Sans effet sur l'accès direct LAN.
    absolute_redirect off;

    # ── Adresse IP réelle du client ──────────────────────────────────────────
    # Le service est atteignable par deux chemins : directement sur le LAN, et
    # via le reverse proxy HTTPS (le reverse proxy, cazalia.fr). Sans ce bloc, tout
    # le trafic HTTPS arriverait avec l'adresse du proxy : la limitation de
    # débit — la sienne comme celle de l'API — mettrait alors TOUS les visiteurs
    # d'Internet dans le même compteur.
    #
    # `set_real_ip_from` ne fait confiance qu'au proxy connu ; pour toute autre
    # provenance, l'en-tête `X-Forwarded-For` reçu est ignoré et l'adresse
    # observée fait foi. Un client du LAN ne peut donc pas usurper son IP.
    # L'API reste sur TRUST_PROXY=1 : elle lit le dernier maillon, celui que
    # nginx ajoute ici et qui est toujours l'adresse réelle du client.
    set_real_ip_from PROXY_IP_A_RENSEIGNER;   # le reverse proxy — NPM
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Front statique buildé (vite build).
    root /var/www/cazalia/web/dist;
    index index.html;

    # Corps de requête borné : l'API n'accepte que du JSON de petite taille.
    client_max_body_size 256k;

    # ── API Express ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=cazalia_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for CONCATÈNE un en-tête envoyé par le client.
        # L'API est configurée avec `trust proxy = 1` : elle ne retient que le
        # dernier maillon, celui ajouté ici. Ne pas augmenter TRUST_PROXY sans
        # ajouter autant de proxys réellement de confiance en amont.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cazalia_proto;
    }

    # Points d'entrée d'authentification : cadence beaucoup plus stricte.
    location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=cazalia_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cazalia_proto;
    }

    # Aucun fichier caché ne doit être servi depuis le build (.env, .git, .DS_Store).
    location ~ /\. {
        deny all;
        access_log off;
    }

    # SPA : tout le reste retombe sur index.html (routing côté client).
    location / {
        # ── HTTP -> HTTPS (visiteurs publics uniquement) ─────────────────────
        # Voir `$cazalia_force_https` plus haut. Placé ICI et non au niveau
        # `server` : un `if` de niveau `server` est évalué AVANT le choix de la
        # `location`, il redirigerait donc aussi `/api/` — or un POST ne survit
        # pas à une redirection (webhook Stripe : paiement jamais transformé en
        # réservation, panne silencieuse). `location /api/` et
        # `location ~ ^/api/auth/…` ne sont donc volontairement PAS redirigées.
        # Conséquence assumée : un GET http://…/api/… public reste servi en
        # clair ; HSTS (émis par l'API et NPM) et l'attribut Secure du cookie
        # limitent l'exposition.
        #
        # 302 et non 301 : un 301 est mis en cache sans limite par les
        # navigateurs ; en cas de boucle, le retour arrière ne réparerait pas
        # les visiteurs déjà touchés. À passer en 301 (cette ligne) après
        # quelques semaines sans incident. Seul `return` dans le `if` : usage
        # sans danger. Le proxy ne doit PAS avoir « Force SSL » côté NPM.
        if ($cazalia_force_https) {
            return 302 https://$cazalia_redirect_host$request_uri;
        }

        # ── En-têtes de sécurité (contenu statique) ──────────────────────────
        # Volontairement posés ICI et non au niveau `server` : les réponses de
        # l'API portent déjà les leurs, et un `add_header` global les
        # DOUBLERAIT. Un `X-Frame-Options` en double est ignoré par certains
        # navigateurs — la protection sauterait précisément là où elle compte.
        # nginx couvre donc le statique, l'API couvre l'API : une seule source
        # par réponse.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; upgrade-insecure-requests" always;
        # HSTS : l'API l'émet déjà dès qu'une requête arrive en HTTPS ; cette
        # ligne couvre le statique une fois le TLS en place devant nginx.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        try_files $uri $uri/ /index.html;
    }
}

# ── TLS ──────────────────────────────────────────────────────────────────────
# Le TLS est terminé en amont, par le reverse proxy (NginxProxy, CT 100), qui
# transmet `X-Forwarded-Proto`. L'API pose donc `Secure` sur le cookie et émet
# HSTS dès que la requête est arrivée en https. La redirection http -> https est
# portée par le `if ($cazalia_force_https)` de `location /` ci-dessus.
#
# NE PAS réactiver le bloc historique ci-dessous : un `return 301 https://…`
# inconditionnel sur :80 redirigerait aussi les requêtes relayées par le proxy
# (qui arrivent en clair) -> boucle infinie, et couperait l'accès direct LAN.
#
#   server { listen 80; server_name …; return 301 https://$host$request_uri; }   # NON
#
# NE PAS décommenter non plus Strict-Transport-Security dans `location /` : le
# proxy l'émet déjà sur toutes les réponses https, l'API aussi sur les siennes.
