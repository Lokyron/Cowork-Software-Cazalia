# Reverse proxy Nginx pour Cazalia (Lucie Cowork) — LXC Debian / Proxmox.
# - sert le build front statique (web/dist)
# - proxifie /api vers l'API Express (127.0.0.1:3001)
#
# Copier dans /etc/nginx/sites-available/ puis activer via un lien symbolique.
#
# ⚠️ L'API ne doit écouter QUE sur 127.0.0.1 (HOST=127.0.0.1 dans l'unité
# systemd). Si le port 3001 est joignable depuis le LAN, tout ce qui suit —
# en-têtes de sécurité, limitation de débit basée sur l'adresse IP réelle — est
# contournable en s'adressant directement à l'API.

# Zones de limitation de débit, partagées par l'ensemble des workers nginx.
# Deuxième rempart devant celui de l'application : nginx absorbe le volume avant
# que Node n'ait à traiter la requête.
limit_req_zone $binary_remote_addr zone=cazalia_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cazalia_auth:10m rate=1r/s;

# Protocole d'origine de la requête.
#
# Le service est joignable directement sur le LAN (http) ET via le reverse proxy
# HTTPS (le reverse proxy). Transmettre `$scheme` en dur ferait croire à l'API que tout
# arrive en clair : elle ne poserait jamais l'attribut `Secure` sur le cookie de
# session et n'émettrait pas HSTS, alors même que le visiteur est en HTTPS.
#
# On reprend donc l'en-tête reçu, mais UNIQUEMENT lorsqu'il vient du proxy de
# confiance. `$realip_remote_addr` est l'adresse réelle du pair TCP, avant la
# réécriture opérée par `set_real_ip_from` — un client du LAN ne peut pas se
# faire passer pour le proxy en envoyant lui-même l'en-tête.
map $realip_remote_addr $cazalia_proto {
    default       $scheme;                  # accès direct : le protocole observé fait foi
    "10.0.0.0" $http_x_forwarded_proto;  # le reverse proxy — NginxProxy (terminaison TLS)
}

server {
    listen 80;
    listen [::]:80;
    server_name cowork.exemple.fr;

    # N'annonce pas la version de nginx dans les réponses et les pages d'erreur.
    server_tokens off;

    # ── Adresse IP réelle du client ──────────────────────────────────────────
    # Le service est atteignable par deux chemins : directement sur le LAN, et
    # via le reverse proxy HTTPS (le reverse proxy, cowork.example.com). Sans ce bloc, tout
    # le trafic HTTPS arriverait avec l'adresse du proxy : la limitation de
    # débit — la sienne comme celle de l'API — mettrait alors TOUS les visiteurs
    # d'Internet dans le même compteur.
    #
    # `set_real_ip_from` ne fait confiance qu'au proxy connu ; pour toute autre
    # provenance, l'en-tête `X-Forwarded-For` reçu est ignoré et l'adresse
    # observée fait foi. Un client du LAN ne peut donc pas usurper son IP.
    # L'API reste sur TRUST_PROXY=1 : elle lit le dernier maillon, celui que
    # nginx ajoute ici et qui est toujours l'adresse réelle du client.
    set_real_ip_from 10.0.0.0;   # le reverse proxy — NginxProxy
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Front statique buildé (vite build).
    root /var/www/lucie-cowork/web/dist;
    index index.html;

    # Corps de requête borné : l'API n'accepte que du JSON de petite taille.
    client_max_body_size 256k;

    # ── API Express ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=cazalia_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for CONCATÈNE un en-tête envoyé par le client.
        # L'API est configurée avec `trust proxy = 1` : elle ne retient que le
        # dernier maillon, celui ajouté ici. Ne pas augmenter TRUST_PROXY sans
        # ajouter autant de proxys réellement de confiance en amont.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cazalia_proto;
    }

    # Points d'entrée d'authentification : cadence beaucoup plus stricte.
    location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=cazalia_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cazalia_proto;
    }

    # Aucun fichier caché ne doit être servi depuis le build (.env, .git, .DS_Store).
    location ~ /\. {
        deny all;
        access_log off;
    }

    # SPA : tout le reste retombe sur index.html (routing côté client).
    location / {
        # ── En-têtes de sécurité (contenu statique) ──────────────────────────
        # Volontairement posés ICI et non au niveau `server` : les réponses de
        # l'API portent déjà les leurs, et un `add_header` global les
        # DOUBLERAIT. Un `X-Frame-Options` en double est ignoré par certains
        # navigateurs — la protection sauterait précisément là où elle compte.
        # nginx couvre donc le statique, l'API couvre l'API : une seule source
        # par réponse.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; upgrade-insecure-requests" always;
        # HSTS : l'API l'émet déjà dès qu'une requête arrive en HTTPS ; cette
        # ligne couvre le statique une fois le TLS en place devant nginx.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        try_files $uri $uri/ /index.html;
    }
}

# ── TLS (à activer dès qu'un nom de domaine est publié) ──────────────────────
# Tant que le service est servi en HTTP, le cookie de session circule en clair
# sur le réseau et l'attribut `Secure` ne peut pas être posé (il rendrait le
# cookie inutilisable). Passer en HTTPS lève simultanément ces deux limites :
# `req.secure` devient vrai, l'API pose `Secure` sur le cookie et émet HSTS.
#
#   certbot --nginx -d cowork.example.com
#
# Puis décommenter l'en-tête Strict-Transport-Security ci-dessus et rediriger
# le port 80 vers 443 :
#
# server {
#     listen 80;
#     server_name cowork.example.com;
#     return 301 https://$host$request_uri;
# }
