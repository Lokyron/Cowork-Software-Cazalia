name: Image Docker

# Construit et publie l'image sur GHCR :
#   push sur main → tag :stable   |   push sur beta → tag :beta
# (+ un tag immuable par commit). L'app de prod tire ensuite ces tags.
on:
  push:
    branches: [main, beta]
    # Ne pas reconstruire l'image pour des changements purement documentaires.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les tests passent AVANT la construction de l'image : un test rouge bloque la
  # publication (`build` en dépend). Mêmes installations que le Dockerfile
  # (`npm install`, le serveur n'a pas de lockfile). `better-sqlite3` s'installe
  # sur le runner Linux (binaire précompilé, sinon compilation avec la chaîne de
  # build déjà présente sur ubuntu-latest). Node 22 : `node --test "test/*.test.js"`
  # n'expanse les motifs glob qu'à partir de Node 21.
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dépendances serveur
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Tests serveur
        working-directory: server
        run: npm test

      - name: Dépendances web
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Tests web
        working-directory: web
        run: npm test

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer le canal
        id: chan
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=stable" >> "$GITHUB_OUTPUT"
          else
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          fi

      - name: Nom d'image (minuscules)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.chan.outputs.tag }}
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            CHANNEL=${{ steps.chan.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
