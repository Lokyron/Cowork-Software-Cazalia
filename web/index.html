<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cazalia, coworking à Montpellier (Boutonnet)</title>
    <meta name="description" content="Espace de coworking au cœur de Boutonnet, à Montpellier : open space et salles de réunion à réserver à l’heure, à la journée ou en abonnement mensuel." />
    <link rel="canonical" href="https://cazalia.fr/" />

    <!-- Open Graph / Twitter Card : valeurs par défaut (celles de l'accueil). Le plugin
         web/seo/plugin.js les remplace par route dans dist/. Source : web/src/lib/seo.js.
         og:image : URL absolue obligatoire. On réutilise hero.jpg ; un visuel dédié
         1200×630 serait préférable pour les aperçus de lien. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cazalia" />
    <meta property="og:title" content="Cazalia, coworking à Montpellier (Boutonnet)" />
    <meta property="og:description" content="Espace de coworking au cœur de Boutonnet, à Montpellier : open space et salles de réunion à réserver à l’heure, à la journée ou en abonnement mensuel." />
    <meta property="og:url" content="https://cazalia.fr/" />
    <meta property="og:image" content="https://cazalia.fr/images/hero.jpg" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png" />
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />

    <!-- Données structurées : bloc de données, non exécuté (la CSP script-src 'self' ne s'applique pas).
         Les tarifs viennent de l'API : volontairement absents ici. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "@id": "https://cazalia.fr/#localbusiness",
      "name": "Cazalia",
      "legalName": "CAZALIA",
      "description": "Espace de coworking à Montpellier, quartier Boutonnet.",
      "url": "https://cazalia.fr/",
      "image": "https://cazalia.fr/images/hero.jpg",
      "telephone": "+33766211483",
      "email": "contact@cazalia.fr",
      "priceRange": "€€",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "99 rue du Faubourg Boutonnet",
        "postalCode": "34090",
        "addressLocality": "Montpellier",
        "addressCountry": "FR"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:30",
          "closes": "19:30"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "09:00",
          "closes": "13:00"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
